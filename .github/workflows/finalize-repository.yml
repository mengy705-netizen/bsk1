name: Finalize Repository Automation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-repository.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize workflows and download docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/build-windows.yml')
          text = workflow.read_text(encoding='utf-8')
          marker = '\n      - name: Publish or update Latest Release\n'
          if marker in text:
              text = text.split(marker, 1)[0].rstrip() + '\n'
              workflow.write_text(text, encoding='utf-8')

          old_name = '空天智感_机翼应变智能监测系统_Windows_x64_最新版.zip'
          new_name = 'WingStrainMonitor_Windows_x64_Latest.zip'
          for name in ['README.md', 'DOWNLOAD.md']:
              p = Path(name)
              if p.exists():
                  t = p.read_text(encoding='utf-8').replace(old_name, new_name)
                  p.write_text(t, encoding='utf-8')
          PY

          git rm --ignore-unmatch .github/workflows/finalize-repository.yml

      - name: Commit final repository layout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-windows.yml README.md DOWNLOAD.md
          if git diff --cached --quiet; then
            echo 'No finalization changes to commit.'
          else
            git commit -m 'Finalize clean build and release automation'
            git push origin main
          fi
