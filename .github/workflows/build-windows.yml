name: Build Windows GUI EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TF_CPP_MIN_LOG_LEVEL: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: "x64"

      - name: Reassemble and extract application source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "source_chunks\part_*.b64" | Sort-Object Name
          if ($parts.Count -eq 0) { throw "No source chunks found." }
          $all = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("source_bundle.zip", [Convert]::FromBase64String($all))
          Expand-Archive -Path "source_bundle.zip" -DestinationPath "." -Force
          if (-not (Test-Path "wing_strain_monitor_windows_installer_project/main.py")) {
            throw "Application source was not extracted correctly."
          }

      - name: Install build dependencies
        shell: pwsh
        working-directory: wing_strain_monitor_windows_installer_project
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements_windows_build.txt
          python -m pip check

      - name: Compile Python sources
        shell: pwsh
        working-directory: wing_strain_monitor_windows_installer_project
        run: python -m compileall -q .

      - name: Build native GUI executable
        shell: pwsh
        working-directory: wing_strain_monitor_windows_installer_project
        run: |
          python -m PyInstaller --noconfirm --clean WingStrainMonitor.spec
          $folder = Join-Path "dist" "空天智感_机翼应变智能监测系统"
          $exe = Join-Path $folder "空天智感_机翼应变智能监测系统.exe"
          if (-not (Test-Path $exe)) {
            Get-ChildItem -Recurse dist | Select-Object FullName
            throw "Expected GUI EXE was not created: $exe"
          }
          Get-Item $exe | Select-Object FullName, Length, LastWriteTime

      - name: Verify GUI executable starts
        shell: pwsh
        working-directory: wing_strain_monitor_windows_installer_project
        run: |
          $folder = Join-Path "dist" "空天智感_机翼应变智能监测系统"
          $exe = Join-Path $folder "空天智感_机翼应变智能监测系统.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "GUI executable exited during startup with code $($p.ExitCode)." }
          Stop-Process -Id $p.Id -Force
          Write-Host "GUI startup smoke test passed."

      - name: Create portable package
        shell: pwsh
        working-directory: wing_strain_monitor_windows_installer_project
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $src = Join-Path "dist" "空天智感_机翼应变智能监测系统"
          $zip = Join-Path "release" "空天智感_机翼应变智能监测系统_Windows_x64_免安装版.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $zip -CompressionLevel Optimal -Force
          Get-Item $zip | Select-Object FullName, Length, LastWriteTime

      - name: Upload Windows executable package
        uses: actions/upload-artifact@v4
        with:
          name: AerospaceWingMonitor-Windows-x64
          path: wing_strain_monitor_windows_installer_project/release/空天智感_机翼应变智能监测系统_Windows_x64_免安装版.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
