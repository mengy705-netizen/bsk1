name: Build Windows GUI EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TF_CPP_MIN_LOG_LEVEL: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: "x64"

      - name: Reassemble verified application source
        shell: pwsh
        run: |
          $names = @(
            "bundle2\part_000.b64",
            "bundle2\part_001.b64",
            "bundle2\part_002.b64",
            "bundle2\part_003.b64",
            "bundle2\part_004.b64",
            "bundle2\part_005.b64",
            "bundle2\part_006a.b64",
            "bundle2\part_006b.b64",
            "bundle2\part_006c.b64",
            "bundle2\part_006d.b64",
            "bundle2\part_007.b64"
          )
          foreach ($n in $names) { if (-not (Test-Path $n)) { throw "Missing source chunk: $n" } }
          $all = ($names | ForEach-Object { Get-Content $_ -Raw }) -join ""
          $all = $all -replace '\s', ''
          if ($all.Length -ne 97680) { throw "Unexpected base64 length: $($all.Length)." }
          [IO.File]::WriteAllBytes("slim_project.tar.xz", [Convert]::FromBase64String($all))
          $sha = (Get-FileHash slim_project.tar.xz -Algorithm SHA256).Hash.ToLower()
          Write-Host "Source SHA256: $sha"
          if ($sha -ne "5571a9515543d6c998fa9d7e1e55f17a984a1c925ab874ad32a54382df7e7b48") { throw "Source bundle checksum mismatch." }
          tar -xJf slim_project.tar.xz
          if (-not (Test-Path "slim_project\main.py")) { throw "main.py missing after extraction." }
          if (-not (Test-Path "slim_project\WingStrainMonitor.spec")) { throw "PyInstaller spec missing after extraction." }

      - name: Apply dense 3D LC-Kriging visualization fix
        shell: pwsh
        run: |
          git fetch origin fix-3d-cloud-v2 --depth=1
          git show origin/fix-3d-cloud-v2:patches/apply_visualization_fix.py | Out-File -FilePath apply_visualization_fix.py -Encoding utf8NoBOM
          python apply_visualization_fix.py slim_project/core/visualization.py
          python -m py_compile slim_project/core/visualization.py

      - name: Install build dependencies
        shell: pwsh
        working-directory: slim_project
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements_windows_build.txt
          python -m pip check

      - name: Compile Python sources
        shell: pwsh
        working-directory: slim_project
        run: |
          python -m compileall -q .

      - name: Build native GUI executable
        shell: pwsh
        working-directory: slim_project
        run: |
          python -m PyInstaller --noconfirm --clean WingStrainMonitor.spec
          $exe = Get-ChildItem -Recurse -Path dist -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $exe) { throw "No GUI executable was produced." }
          $folder = $exe.Directory.FullName
          $targetExe = Join-Path $folder "空天智感_机翼应变智能监测系统.exe"
          if ($exe.FullName -ne $targetExe) {
            Copy-Item $exe.FullName $targetExe -Force
            Remove-Item $exe.FullName -Force
          }
          Set-Content -Path "$env:GITHUB_WORKSPACE\exe_folder.txt" -Value $folder -Encoding utf8
          Set-Content -Path "$env:GITHUB_WORKSPACE\exe_path.txt" -Value $targetExe -Encoding utf8
          Get-Item $targetExe | Select-Object FullName, Length, LastWriteTime

      - name: GUI startup smoke test
        shell: pwsh
        run: |
          $exe = (Get-Content exe_path.txt -Raw).Trim()
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "GUI executable exited during startup with code $($p.ExitCode)." }
          Stop-Process -Id $p.Id -Force
          Write-Host "GUI startup smoke test passed."

      - name: Create portable package
        shell: pwsh
        run: |
          $folder = (Get-Content exe_folder.txt -Raw).Trim()
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $zip = Join-Path $env:GITHUB_WORKSPACE "release\空天智感_机翼应变智能监测系统_Windows_x64_三维云图修正版.zip"
          Compress-Archive -Path "$folder\*" -DestinationPath $zip -CompressionLevel Optimal -Force
          Get-Item $zip | Select-Object FullName, Length, LastWriteTime

      - name: Upload Windows executable package
        uses: actions/upload-artifact@v4
        with:
          name: AerospaceWingMonitor-Windows-x64-3DCloudFix
          path: release/空天智感_机翼应变智能监测系统_Windows_x64_三维云图修正版.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
