name: Build Windows GUI EXE

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TF_CPP_MIN_LOG_LEVEL: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: "x64"

      - name: Verify clean source layout
        shell: pwsh
        run: |
          if (-not (Test-Path "app\main.py")) { throw "app/main.py is missing." }
          if (-not (Test-Path "app\WingStrainMonitor.spec")) { throw "app/WingStrainMonitor.spec is missing." }
          if (-not (Test-Path "app\core\visualization.py")) { throw "app/core/visualization.py is missing." }

      - name: Install build dependencies
        shell: pwsh
        working-directory: app
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements_windows_build.txt
          python -m pip check

      - name: Compile Python sources
        shell: pwsh
        working-directory: app
        run: |
          python -m compileall -q .

      - name: Build native GUI executable
        shell: pwsh
        working-directory: app
        run: |
          python -m PyInstaller --noconfirm --clean WingStrainMonitor.spec
          $exe = Get-ChildItem -Recurse -Path dist -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $exe) { throw "No GUI executable was produced." }
          $folder = $exe.Directory.FullName
          $targetExe = Join-Path $folder "空天智感_机翼应变智能监测系统.exe"
          if ($exe.FullName -ne $targetExe) {
            Copy-Item $exe.FullName $targetExe -Force
            Remove-Item $exe.FullName -Force
          }
          Set-Content -Path "$env:GITHUB_WORKSPACE\exe_folder.txt" -Value $folder -Encoding utf8
          Set-Content -Path "$env:GITHUB_WORKSPACE\exe_path.txt" -Value $targetExe -Encoding utf8
          Get-Item $targetExe | Select-Object FullName, Length, LastWriteTime

      - name: GUI startup smoke test
        shell: pwsh
        run: |
          $exe = (Get-Content exe_path.txt -Raw).Trim()
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "GUI executable exited during startup with code $($p.ExitCode)." }
          Stop-Process -Id $p.Id -Force
          Write-Host "GUI startup smoke test passed."

      - name: Create portable Windows package
        shell: pwsh
        run: |
          $folder = (Get-Content exe_folder.txt -Raw).Trim()
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $zip = Join-Path $env:GITHUB_WORKSPACE "release\空天智感_机翼应变智能监测系统_Windows_x64_最新版.zip"
          Compress-Archive -Path "$folder\*" -DestinationPath $zip -CompressionLevel Optimal -Force
          Get-Item $zip | Select-Object FullName, Length, LastWriteTime

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AerospaceWingMonitor-Windows-x64-Latest
          path: release/空天智感_机翼应变智能监测系统_Windows_x64_最新版.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish or update Latest Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "release\空天智感_机翼应变智能监测系统_Windows_x64_最新版.zip"
          gh release view latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest $asset --target "$env:GITHUB_SHA" --title "空天智感机翼应变智能监测系统 - 最新版" --notes "Windows x64 免安装版。下载 ZIP，解压后直接运行 空天智感_机翼应变智能监测系统.exe。Copyright © 2026 空天智感团队. All Rights Reserved. 版权所有。"
          } else {
            gh release upload latest $asset --clobber
          }
