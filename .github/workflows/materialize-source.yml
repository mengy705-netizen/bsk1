name: Materialize Clean Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-source.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble verified source bundle
        shell: bash
        run: |
          set -euo pipefail
          parts=(
            bundle2/part_000.b64
            bundle2/part_001.b64
            bundle2/part_002.b64
            bundle2/part_003.b64
            bundle2/part_004.b64
            bundle2/part_005.b64
            bundle2/part_006a.b64
            bundle2/part_006b.b64
            bundle2/part_006c.b64
            bundle2/part_006d.b64
            bundle2/part_007.b64
          )
          for p in "${parts[@]}"; do test -f "$p" || { echo "Missing $p"; exit 1; }; done
          cat "${parts[@]}" | tr -d '\r\n\t ' > source.b64
          python - <<'PY'
          import base64, hashlib
          from pathlib import Path
          s = Path('source.b64').read_text().strip()
          if len(s) != 97680:
              raise SystemExit(f'Unexpected base64 length: {len(s)}')
          data = base64.b64decode(s)
          sha = hashlib.sha256(data).hexdigest()
          expected = '5571a9515543d6c998fa9d7e1e55f17a984a1c925ab874ad32a54382df7e7b48'
          if sha != expected:
              raise SystemExit(f'Checksum mismatch: {sha}')
          Path('slim_project.tar.xz').write_bytes(data)
          print('Verified source SHA256:', sha)
          PY
          tar -xJf slim_project.tar.xz

      - name: Apply current 3D cloud visualization fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix-3d-cloud-v2 --depth=1
          git show origin/fix-3d-cloud-v2:patches/apply_visualization_fix.py > apply_visualization_fix.py
          python apply_visualization_fix.py slim_project/core/visualization.py
          python -m py_compile slim_project/core/visualization.py

      - name: Create clean app directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app
          mkdir -p app
          cp -a slim_project/. app/
          find app -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find app -type d -name '.pytest_cache' -prune -exec rm -rf {} + || true
          rm -rf app/build app/dist app/release
          cat > .gitignore <<'EOF'
          __pycache__/
          *.py[cod]
          .pytest_cache/
          .venv/
          venv/
          build/
          dist/
          release/
          *.log
          EOF

      - name: Commit clean source layout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app .gitignore
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'Add clean application source under app directory'
            git push origin main
          fi
