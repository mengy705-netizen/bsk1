name: Cleanup Repository Layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-repository.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary build-transfer files
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch bundle2 runtime_chunks source_chunks
          git rm --ignore-unmatch source_bundle.b64
          git rm --ignore-unmatch .github/workflows/materialize-source.yml
          git rm --ignore-unmatch .github/workflows/build-exe-only.yml

      - name: Write download and copyright docs
        shell: bash
        run: |
          cat > COPYRIGHT.md <<'EOF'
          # 版权声明

          Copyright © 2026 空天智感团队. All Rights Reserved. 版权所有。

          本仓库中由空天智感团队自主编写或制作的源代码、软件界面、模型管理与推理实现、三维可视化实现、项目文档、图形素材及相关工程文件均受版权保护。

          未经版权所有者事先书面授权，不得擅自复制、修改、分发、再发布、出售、转授权，或将本项目及其衍生版本用于商业用途。

          本版权声明仅针对本项目自主创作的具体代码、实现、界面和文档，不主张对 BP、CNN、迁移学习、Kriging 等公开理论、通用算法或第三方依赖库本身的所有权。第三方组件遵循其各自许可证和版权条款。
          EOF

          cat > DOWNLOAD.md <<'EOF'
          # 下载说明

          ## 直接运行 Windows 版

          打开仓库右侧 **Releases**，进入 **Latest**，下载：

          `空天智感_机翼应变智能监测系统_Windows_x64_最新版.zip`

          解压后直接运行：

          `空天智感_机翼应变智能监测系统.exe`

          不需要额外安装 Python。

          ## 下载源码

          在仓库首页点击绿色 **Code** 按钮，然后点击 **Download ZIP**。

          下载后的源码位于 `app/` 目录。
          EOF

          cat > README.md <<'EOF'
          # 空天智感——机翼应变智能监测系统

          > 面向航空结构健康监测（SHM）的机翼应变智能分析平台

          **团队：空天智感团队**  
          **平台：Windows x64 GUI**  
          **当前版本：三维云图一致性修正版**

          ## 下载

          **可直接运行的 Windows 版：**进入仓库右侧 **Releases** → **Latest**，下载 `空天智感_机翼应变智能监测系统_Windows_x64_最新版.zip`，解压后双击 EXE 即可运行。

          **源码：**点击绿色 **Code** → **Download ZIP**。完整源码位于下载包中的 `app/` 目录。

          详细说明见 [`DOWNLOAD.md`](./DOWNLOAD.md)。

          ## 项目简介

          本项目面向机翼及薄壁航空结构的应变监测、载荷反演与损伤识别需求，构建集 **48 通道应变数据输入、智能模型推理、迁移学习、LC-Kriging 应变场重构、三维机翼可视化和模型管理** 于一体的结构健康监测软件平台。

          系统以 48 个应变传感器数据为核心输入，通过损伤分类模型判断结构状态，并调用对应的回归模型完成载荷参数或损伤参数预测；随后利用 LC-Kriging 方法重构连续应变场，并将同一应变场映射至三维机翼模型，实现二维俯视云图与三维表面云图的一致显示。

          ## 核心功能

          - 48 通道应变数据管理与传感器坐标配置
          - BP 损伤分类
          - 无损状态：载荷位置与载荷大小预测
          - 损伤状态：损伤位置与损伤尺寸预测
          - 七模型独立导入与管理
          - 输入/输出归一化器独立配置
          - 预训练 → 迁移学习两阶段模型流程
          - AE 共享表征与知识蒸馏迁移
          - LC-Kriging 连续应变场重构
          - STL / OBJ 等三维机翼模型管理
          - 48 个传感器手动布置
          - 二维应变云图与三维机翼云图联动显示
          - Windows x64 无控制台 GUI 可执行程序

          ## 七模型推理结构

          ```text
          48 通道应变
                │
                ▼
          BP 损伤分类
            ┌───┴───┐
            │       │
          无损     损伤
            │       │
            ├─位置 1  ├─位置 1
            ├─位置 2  ├─位置 2
            └─载荷大小 └─损伤尺寸
                │
                ▼
          LC-Kriging 应变场重构
                │
                ▼
          二维云图 + 三维机翼表面映射
          ```

          ## 三维云图一致性修正

          当前版本已修正更换三维机翼模型后出现的大块三角形着色问题。二维俯视图和三维机翼表面现在使用同一个 LC-Kriging 连续应变场，三维模型仅提供几何外形与厚度信息，不再由 STL/OBJ 网格粗细决定应变场显示分辨率。

          ## 仓库结构

          ```text
          bsk1/
          ├─ app/                  # 软件完整源码
          ├─ .github/workflows/    # Windows 自动构建与发布
          ├─ README.md             # 项目介绍
          ├─ DOWNLOAD.md           # 下载说明
          ├─ COPYRIGHT.md          # 版权声明
          └─ .gitignore
          ```

          ## 自动构建与发布

          当 `app/` 中的正式源码发生更新时，GitHub Actions 会在 Windows x64 环境重新构建并进行 GUI 启动测试，随后自动更新 **Latest Release** 中的可运行版本。

          ## 版权

          **Copyright © 2026 空天智感团队. All Rights Reserved. 版权所有。**

          未经授权不得擅自复制、修改、分发、再发布或用于商业用途。详细条款见 [`COPYRIGHT.md`](./COPYRIGHT.md)。
          EOF

      - name: Commit cleaned repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md DOWNLOAD.md COPYRIGHT.md
          git rm --ignore-unmatch .github/workflows/cleanup-repository.yml
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit.'
          else
            git commit -m 'Organize repository for source and release downloads'
            git push origin main
          fi
