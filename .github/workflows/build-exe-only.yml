name: Build EXE Only

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-exe-only.yml'

permissions:
  contents: read

jobs:
  build-exe-only:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TF_CPP_MIN_LOG_LEVEL: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: "x64"

      - name: Reassemble source
        shell: pwsh
        run: |
          $names = @(
            "bundle2\part_000.b64",
            "bundle2\part_001.b64",
            "bundle2\part_002.b64",
            "bundle2\part_003.b64",
            "bundle2\part_004.b64",
            "bundle2\part_005.b64",
            "bundle2\part_006a.b64",
            "bundle2\part_006b.b64",
            "bundle2\part_006c.b64",
            "bundle2\part_006d.b64",
            "bundle2\part_007.b64"
          )
          $all = ($names | ForEach-Object { Get-Content $_ -Raw }) -join ""
          $all = $all -replace '\s', ''
          [IO.File]::WriteAllBytes("slim_project.tar.xz", [Convert]::FromBase64String($all))
          tar -xJf slim_project.tar.xz

      - name: Apply visualization fix
        shell: pwsh
        run: |
          git fetch origin fix-3d-cloud-v2 --depth=1
          git show origin/fix-3d-cloud-v2:patches/apply_visualization_fix.py | Out-File -FilePath apply_visualization_fix.py -Encoding utf8NoBOM
          python apply_visualization_fix.py slim_project/core/visualization.py
          python -m py_compile slim_project/core/visualization.py

      - name: Install dependencies
        shell: pwsh
        working-directory: slim_project
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements_windows_build.txt

      - name: Build EXE
        shell: pwsh
        working-directory: slim_project
        run: |
          python -m PyInstaller --noconfirm --clean WingStrainMonitor.spec
          $exe = Get-ChildItem -Recurse -Path dist -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "No EXE produced." }
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\replacement_exe" -Force | Out-Null
          Copy-Item $exe.FullName "$env:GITHUB_WORKSPACE\replacement_exe\空天智感_机翼应变智能监测系统.exe" -Force

      - name: Smoke test
        shell: pwsh
        run: |
          $exe = "$env:GITHUB_WORKSPACE\replacement_exe\空天智感_机翼应变智能监测系统.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "GUI startup failed with code $($p.ExitCode)." }
          Stop-Process -Id $p.Id -Force

      - name: Upload replacement EXE only
        uses: actions/upload-artifact@v4
        with:
          name: WingStrainMonitor-3DCloudFix-EXE-Only
          path: replacement_exe/空天智感_机翼应变智能监测系统.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
